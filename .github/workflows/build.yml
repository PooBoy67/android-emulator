                  '        applicationId = "com.swordfish.lemuroid"\n        ndk { abiFilters += listOf("armeabi-v7a", "arm64-v8a") }\n')

          # 6) drop the huge cores we do not need (keeps the APK small)
          J = f"{R}/lemuroid-cores/bundled-cores/src/main/jniLibs"
          for abi in os.listdir(J):
