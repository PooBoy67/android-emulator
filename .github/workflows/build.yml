name: Build TV Pad APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Get Lemuroid (pinned version)
        run: |
          git clone https://github.com/Swordfish90/Lemuroid.git
          cd Lemuroid
          git checkout 3625bc121d5d79fd4b80ce930fb0f3236c9334e8
          git submodule update --init --depth 1

      - name: Write TV Pad files
        run: |
          mkdir -p overlay
          cat > overlay/RemotePadHost.kt <<'EOF_REMOTEPADHOST'
          package com.swordfish.lemuroid.app.shared.remotepad

          import java.io.BufferedReader
          import java.io.InputStreamReader
          import java.net.Inet4Address
          import java.net.InetSocketAddress
          import java.net.NetworkInterface
          import java.net.ServerSocket
          import java.net.Socket
          import java.util.Collections

          /**
           * TV side. Listens for phones, checks the pairing code and forwards their input.
           * Protocol (text lines over TCP):
           *   phone -> "PAD1 <code>"   tv -> "OK <player>" or "NO"
           *   phone -> "K <androidKeyCode> <0|1>"   d-pad: "D <x> <y>"   commands: "C <NAME> [arg]"   "P" ping
           */
          class RemotePadHost(
              private val onInput: (player: Int, line: String) -> Unit,
              private val onClients: (count: Int) -> Unit,
          ) {
              @Volatile private var server: ServerSocket? = null
              @Volatile private var running = false
              private val players = Collections.synchronizedMap(HashMap<Int, Socket>())

              var code: String = "-----"
                  private set

              fun start() {
                  if (running) return
                  running = true
                  code = codeFor(localIpv4())
                  Thread({ acceptLoop() }, "pad-accept").apply { isDaemon = true }.start()
              }

              fun stop() {
                  running = false
                  runCatching { server?.close() }
                  synchronized(players) { players.values.forEach { runCatching { it.close() } } }
                  players.clear()
              }

              private fun acceptLoop() {
                  while (running) {
                      try {
                          val s = ServerSocket()
                          s.reuseAddress = true
                          s.bind(InetSocketAddress(PORT))
                          server = s
                          while (running) {
                              val c = s.accept()
                              Thread({ handle(c) }, "pad-client").apply { isDaemon = true }.start()
                          }
                      } catch (e: Exception) {
                          if (!running) return
                          runCatching { Thread.sleep(1000) }
                      }
                  }
              }

              private fun handle(socket: Socket) {
                  var player = -1
                  try {
                      socket.tcpNoDelay = true
                      socket.soTimeout = 10000
                      val reader = BufferedReader(InputStreamReader(socket.getInputStream()))
                      val out = socket.getOutputStream()
                      val hello = reader.readLine() ?: return
                      val parts = hello.trim().split(" ")
                      if (parts.size < 2 || parts[0] != "PAD1" || parts[1] != code) {
                          out.write("NO\n".toByteArray()); out.flush()
                          return
                      }
                      synchronized(players) {
                          player = (0..3).firstOrNull { !players.containsKey(it) } ?: -1
                          if (player >= 0) players[player] = socket
                      }
                      if (player < 0) {
                          out.write("NO\n".toByteArray()); out.flush()
                          return
                      }
                      out.write("OK $player\n".toByteArray()); out.flush()
                      onClients(players.size)
                      while (running) {
                          val line = reader.readLine() ?: break
                          if (line == "P") continue
                          onInput(player, line)
                      }
                  } catch (_: Exception) {
                  } finally {
                      if (player >= 0) {
                          players.remove(player)
                          onInput(player, "X") // release everything held by this phone
                          onClients(players.size)
                      }
                      runCatching { socket.close() }
                  }
              }

              companion object {
                  const val PORT = 8765

                  fun localIpv4(): Inet4Address? {
                      val all = NetworkInterface.getNetworkInterfaces()?.toList().orEmpty()
                      val good = all.filter { it.isUp && !it.isLoopback }
                          .filter { n -> listOf("rmnet", "ccmni", "tun", "dummy", "v4-").none { n.name.startsWith(it) } }
                      val addrs = good.flatMap { n -> n.inetAddresses.toList().filterIsInstance<Inet4Address>().map { n.name to it } }
                          .filter { it.second.isSiteLocalAddress }
                      return (addrs.firstOrNull { it.first.startsWith("wlan") || it.first.startsWith("eth") } ?: addrs.firstOrNull())?.second
                  }

                  /** Code = last two bytes of the IP as 5 digits. The phone fills in the first two from its own IP. */
                  fun codeFor(ip: Inet4Address?): String {
                      val b = ip?.address ?: return "00000"
                      val v = (b[2].toInt() and 0xff) * 256 + (b[3].toInt() and 0xff)
                      return v.toString().padStart(5, '0')
                  }
              }
          }
          EOF_REMOTEPADHOST
          cat > overlay/PadClient.kt <<'EOF_PADCLIENT'
          package com.swordfish.lemuroid.app.shared.remotepad

          import java.io.BufferedReader
          import java.io.InputStreamReader
          import java.net.InetSocketAddress
          import java.net.Socket
          import java.util.concurrent.LinkedBlockingQueue

          /** Phone side connection to the TV. */
          class PadClient(private val onLost: () -> Unit) {
              private var socket: Socket? = null
              private val queue = LinkedBlockingQueue<String>()
              @Volatile private var alive = false

              /** Blocking. Returns player number, or throws. Call from a background thread. */
              fun connect(host: String, code: String): Int {
                  val s = Socket()
                  s.connect(InetSocketAddress(host, RemotePadHost.PORT), 3000)
                  s.tcpNoDelay = true
                  s.soTimeout = 4000
                  val reader = BufferedReader(InputStreamReader(s.getInputStream()))
                  val out = s.getOutputStream()
                  out.write("PAD1 $code\n".toByteArray()); out.flush()
                  val reply = reader.readLine() ?: throw IllegalStateException("No answer")
                  if (!reply.startsWith("OK")) { s.close(); throw IllegalStateException("Wrong code") }
                  val player = reply.removePrefix("OK").trim().toIntOrNull() ?: 0
                  socket = s
                  alive = true
                  Thread({
                      try {
                          while (alive) {
                              val l = queue.poll(3, java.util.concurrent.TimeUnit.SECONDS) ?: "P"
                              out.write((l + "\n").toByteArray()); out.flush()
                          }
                      } catch (_: Exception) {
                          lost()
                      }
                  }, "pad-writer").apply { isDaemon = true }.start()
                  Thread({
                      try {
                          s.soTimeout = 0
                          while (alive && reader.readLine() != null) { /* nothing expected */ }
                      } catch (_: Exception) {
                      }
                      lost()
                  }, "pad-reader").apply { isDaemon = true }.start()
                  return player
              }

              private fun lost() {
                  if (alive) {
                      alive = false
                      runCatching { socket?.close() }
                      onLost()
                  }
              }

              fun send(line: String) { if (alive) queue.offer(line) }

              fun close() {
                  alive = false
                  runCatching { socket?.close() }
              }
          }
          EOF_PADCLIENT
          cat > overlay/PadView.kt <<'EOF_PADVIEW'
          package com.swordfish.lemuroid.app.shared.remotepad

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.RectF
          import android.view.HapticFeedbackConstants
          import android.view.MotionEvent
          import android.view.View
          import kotlin.math.abs
          import kotlin.math.hypot
          import kotlin.math.min

          class PadView(
              context: Context,
              private val send: (String) -> Unit,
              private val onMenu: () -> Unit,
              private val loadLayout: () -> String?,
              private val saveLayout: (String) -> Unit,
          ) : View(context) {

              enum class Kind { DPAD, ROUND, SHOULDER, PILL, CMD }

              class Elt(
                  val id: String, val kind: Kind, val label: String, val key: Int,
                  var x: Float, var y: Float, var s: Float, var visible: Boolean = true,
              )

              private val elts = mutableListOf<Elt>()
              var editMode = false
                  set(v) { field = v; selected = null; invalidate() }
              private var selected: Elt? = null
              private var slot = 0
              private var banner = ""
              private var bannerUntil = 0L

              private val pressed = HashSet<String>()      // element ids currently held
              private val heldKeys = HashSet<Int>()
              private var dpadX = 0f
              private var dpadY = 0f
              private val firedCmd = HashMap<Int, String>() // pointerId -> cmd already fired

              private val fill = Paint(Paint.ANTI_ALIAS_FLAG)
              private val stroke = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.STROKE; strokeWidth = 4f }
              private val text = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.WHITE; textAlign = Paint.Align.CENTER; isFakeBoldText = true }

              init {
                  setBackgroundColor(Color.rgb(18, 18, 24))
                  resetLayout(false)
                  loadLayout()?.let { applySaved(it) }
              }

              fun resetLayout(save: Boolean = true) {
                  elts.clear()
                  elts += Elt("dpad", Kind.DPAD, "", 0, 0.17f, 0.60f, 0.40f)
                  elts += Elt("a", Kind.ROUND, "A", 96, 0.92f, 0.56f, 0.17f)
                  elts += Elt("b", Kind.ROUND, "B", 97, 0.83f, 0.74f, 0.17f)
                  elts += Elt("x", Kind.ROUND, "X", 99, 0.83f, 0.38f, 0.17f)
                  elts += Elt("y", Kind.ROUND, "Y", 100, 0.74f, 0.56f, 0.17f)
                  elts += Elt("l", Kind.SHOULDER, "L", 102, 0.12f, 0.10f, 0.22f)
                  elts += Elt("r", Kind.SHOULDER, "R", 103, 0.88f, 0.10f, 0.22f)
                  elts += Elt("select", Kind.PILL, "SELECT", 109, 0.42f, 0.90f, 0.14f)
                  elts += Elt("start", Kind.PILL, "START", 108, 0.58f, 0.90f, 0.14f)
                  elts += Elt("save", Kind.CMD, "SAVE", 0, 0.34f, 0.14f, 0.13f)
                  elts += Elt("slot", Kind.CMD, "SLOT 1", 0, 0.50f, 0.14f, 0.13f)
                  elts += Elt("load", Kind.CMD, "LOAD", 0, 0.66f, 0.14f, 0.13f)
                  elts += Elt("ff", Kind.CMD, "FAST", 0, 0.50f, 0.30f, 0.12f, false)
                  elts += Elt("reset", Kind.CMD, "RESET", 0, 0.30f, 0.30f, 0.12f, false)
                  if (save) persist()
                  invalidate()
              }

              private fun persist() {
                  saveLayout(elts.joinToString(";") { "${it.id}=${it.x},${it.y},${it.s},${if (it.visible) 1 else 0}" })
              }

              private fun applySaved(s: String) {
                  runCatching {
                      s.split(";").forEach { part ->
                          val (id, v) = part.split("=")
                          val n = v.split(",")
                          elts.firstOrNull { it.id == id }?.let {
                              it.x = n[0].toFloat(); it.y = n[1].toFloat(); it.s = n[2].toFloat(); it.visible = n[3] == "1"
                          }
                      }
                  }
              }

              // ---- geometry helpers
              private fun unit() = min(width, height).toFloat()
              private fun cx(e: Elt) = e.x * width
              private fun cy(e: Elt) = e.y * height
              private fun dia(e: Elt) = e.s * unit()

              private fun hit(e: Elt, px: Float, py: Float): Boolean {
                  val d = dia(e)
                  return when (e.kind) {
                      Kind.DPAD, Kind.ROUND -> hypot(px - cx(e), py - cy(e)) <= d * (if (e.kind == Kind.DPAD) 0.62f else 0.62f)
                      Kind.SHOULDER -> abs(px - cx(e)) <= d * 0.9f && abs(py - cy(e)) <= d * 0.5f
                      Kind.PILL, Kind.CMD -> abs(px - cx(e)) <= d * 0.75f && abs(py - cy(e)) <= d * 0.42f
                  }
              }

              private fun nearest(px: Float, py: Float): Elt? =
                  elts.filter { (it.visible || editMode) && hit(it, px, py) }
                      .minByOrNull { hypot(px - cx(it), py - cy(it)) }

              // ---- drawing
              override fun onDraw(c: Canvas) {
                  for (e in elts) {
                      if (!e.visible && !editMode) continue
                      val on = pressed.contains(e.id)
                      val alpha = if (!e.visible) 70 else 255
                      fill.color = if (on) Color.argb(alpha, 120, 170, 255) else Color.argb(alpha, 52, 54, 70)
                      stroke.color = if (e === selected) Color.YELLOW else Color.argb(alpha, 150, 155, 185)
                      val d = dia(e)
                      when (e.kind) {
                          Kind.DPAD -> drawDpad(c, e, d)
                          Kind.ROUND -> {
                              c.drawCircle(cx(e), cy(e), d / 2, fill); c.drawCircle(cx(e), cy(e), d / 2, stroke)
                              label(c, if (e.id == "slot") "SLOT ${slot + 1}" else e.label, cx(e), cy(e), d * 0.45f)
                          }
                          Kind.SHOULDER -> {
                              val r = RectF(cx(e) - d * 0.8f, cy(e) - d * 0.38f, cx(e) + d * 0.8f, cy(e) + d * 0.38f)
                              c.drawRoundRect(r, 28f, 28f, fill); c.drawRoundRect(r, 28f, 28f, stroke)
                              label(c, e.label, cx(e), cy(e), d * 0.42f)
                          }
                          Kind.PILL, Kind.CMD -> {
                              val r = RectF(cx(e) - d * 0.65f, cy(e) - d * 0.3f, cx(e) + d * 0.65f, cy(e) + d * 0.3f)
                              c.drawRoundRect(r, 40f, 40f, fill); c.drawRoundRect(r, 40f, 40f, stroke)
                              label(c, if (e.id == "slot") "SLOT ${slot + 1}" else e.label, cx(e), cy(e), d * 0.26f)
                          }
                      }
                      text.alpha = 255
                  }
                  // fixed menu button (top centre, not editable)
                  fill.color = Color.argb(200, 40, 40, 55)
                  c.drawCircle(width / 2f, 0.05f * height + 6f, 0.035f * unit() + 14f, fill)
                  label(c, "\u22EE", width / 2f, 0.05f * height + 6f, 0.07f * unit() + 20f)
                  if (editMode) drawEditBar(c)
                  if (System.currentTimeMillis() < bannerUntil) {
                      text.textSize = 0.05f * unit() + 10f
                      fill.color = Color.argb(190, 0, 0, 0)
                      val w = text.measureText(banner) + 50f
                      c.drawRoundRect(RectF(width / 2f - w / 2, height * 0.42f, width / 2f + w / 2, height * 0.42f + text.textSize * 1.8f), 30f, 30f, fill)
                      c.drawText(banner, width / 2f, height * 0.42f + text.textSize * 1.25f, text)
                      postInvalidateDelayed(200)
                  }
              }

              private fun label(c: Canvas, s: String, x: Float, y: Float, size: Float) {
                  text.textSize = size
                  c.drawText(s, x, y + size * 0.35f, text)
              }

              private fun drawDpad(c: Canvas, e: Elt, d: Float) {
                  val x = cx(e); val y = cy(e); val arm = d * 0.18f; val len = d * 0.5f
                  val h = RectF(x - len, y - arm, x + len, y + arm)
                  val v = RectF(x - arm, y - len, x + arm, y + len)
                  c.drawRoundRect(h, 20f, 20f, fill); c.drawRoundRect(v, 20f, 20f, fill)
                  c.drawRoundRect(h, 20f, 20f, stroke); c.drawRoundRect(v, 20f, 20f, stroke)
                  fill.color = Color.argb(255, 120, 170, 255)
                  if (dpadY < -0.3f) c.drawRoundRect(RectF(x - arm, y - len, x + arm, y - arm), 20f, 20f, fill)
                  if (dpadY > 0.3f) c.drawRoundRect(RectF(x - arm, y + arm, x + arm, y + len), 20f, 20f, fill)
                  if (dpadX < -0.3f) c.drawRoundRect(RectF(x - len, y - arm, x - arm, y + arm), 20f, 20f, fill)
                  if (dpadX > 0.3f) c.drawRoundRect(RectF(x + arm, y - arm, x + len, y + arm), 20f, 20f, fill)
              }

              // ---- edit bar (bottom): - + Hide/Show Reset Done
              private val barLabels = listOf("\u2212", "+", "HIDE", "RESET", "DONE")
              private fun barRect(i: Int): RectF {
                  val w = width / 7f; val h = height * 0.14f
                  val left = (width - w * 5.4f) / 2f + i * w * 1.1f
                  val top = height * 0.78f
                  return RectF(left, top, left + w, top + h)
              }
              private fun drawEditBar(c: Canvas) {
                  fill.color = Color.argb(230, 25, 25, 35)
                  c.drawRect(0f, height * 0.74f, width.toFloat(), height.toFloat(), fill)
                  for (i in barLabels.indices) {
                      fill.color = Color.rgb(70, 90, 150)
                      val r = barRect(i)
                      c.drawRoundRect(r, 24f, 24f, fill)
                      val t = if (i == 2 && selected?.visible == false) "SHOW" else barLabels[i]
                      label(c, t, r.centerX(), r.centerY(), r.height() * 0.34f)
                  }
                  label(c, if (selected == null) "Drag a button to move it" else "Selected: ${selected!!.id.uppercase()}", width / 2f, height * 0.74f + 22f, height * 0.045f)
              }

              // ---- touch
              override fun onTouchEvent(ev: MotionEvent): Boolean {
                  if (editMode) return editTouch(ev)
                  val action = ev.actionMasked
                  if (action == MotionEvent.ACTION_DOWN || action == MotionEvent.ACTION_POINTER_DOWN) {
                      val i = ev.actionIndex
                      val px = ev.getX(i); val py = ev.getY(i)
                      // menu button
                      if (hypot(px - width / 2f, py - (0.05f * height + 6f)) < 0.06f * unit() + 20f) { onMenu(); return true }
                      val e = nearest(px, py)
                      if (e != null && e.kind == Kind.CMD) {
                          fireCmd(e)
                          firedCmd[ev.getPointerId(i)] = e.id
                          performHapticFeedback(HapticFeedbackConstants.VIRTUAL_KEY)
                      }
                  }
                  if (action == MotionEvent.ACTION_UP || action == MotionEvent.ACTION_POINTER_UP || action == MotionEvent.ACTION_CANCEL) {
                      firedCmd.remove(ev.getPointerId(ev.actionIndex))
                  }
                  recompute(ev)
                  return true
              }

              private fun recompute(ev: MotionEvent) {
                  val newPressed = HashSet<String>()
                  val newKeys = HashSet<Int>()
                  var nx = 0f; var ny = 0f
                  val ending = ev.actionMasked == MotionEvent.ACTION_UP || ev.actionMasked == MotionEvent.ACTION_CANCEL
                  for (i in 0 until ev.pointerCount) {
                      if (ending) break
                      if (ev.actionMasked == MotionEvent.ACTION_POINTER_UP && i == ev.actionIndex) continue
                      val px = ev.getX(i); val py = ev.getY(i)
                      val e = nearest(px, py) ?: continue
                      when (e.kind) {
                          Kind.DPAD -> {
                              val ddx = px - cx(e); val ddy = py - cy(e)
                              val dist = hypot(ddx, ddy)
                              if (dist > dia(e) * 0.08f) {
                                  val ux = ddx / dist; val uy = ddy / dist
                                  if (ux < -0.38f) nx = -1f else if (ux > 0.38f) nx = 1f
                                  if (uy < -0.38f) ny = -1f else if (uy > 0.38f) ny = 1f
                                  newPressed += "dpad"
                              }
                          }
                          Kind.CMD -> {}
                          else -> { newPressed += e.id; newKeys += e.key }
                      }
                  }
                  for (k in newKeys - heldKeys) send("K $k 1")
                  for (k in heldKeys - newKeys) send("K $k 0")
                  if (nx != dpadX || ny != dpadY) {
                      dpadX = nx; dpadY = ny
                      send("D $nx $ny")
                      performHapticFeedback(HapticFeedbackConstants.VIRTUAL_KEY)
                  }
                  if ((newKeys - heldKeys).isNotEmpty()) performHapticFeedback(HapticFeedbackConstants.VIRTUAL_KEY)
                  heldKeys.clear(); heldKeys.addAll(newKeys)
                  pressed.clear(); pressed.addAll(newPressed)
                  for (e in elts) if (e.kind == Kind.CMD && firedCmd.containsValue(e.id)) pressed += e.id
                  invalidate()
              }

              private fun fireCmd(e: Elt) {
                  when (e.id) {
                      "save" -> { send("C SAVE $slot"); toast("Saved to slot ${slot + 1}") }
                      "load" -> { send("C LOAD $slot"); toast("Loaded slot ${slot + 1}") }
                      "slot" -> { slot = (slot + 1) % 4; toast("Slot ${slot + 1} selected") }
                      "ff" -> send("C FF")
                      "reset" -> send("C RESET")
                  }
              }

              fun toast(s: String) { banner = s; bannerUntil = System.currentTimeMillis() + 1400; invalidate() }

              private var dragDx = 0f
              private var dragDy = 0f
              private fun editTouch(ev: MotionEvent): Boolean {
                  val px = ev.x; val py = ev.y
                  when (ev.actionMasked) {
                      MotionEvent.ACTION_DOWN -> {
                          if (py > height * 0.74f) {
                              for (i in barLabels.indices) if (barRect(i).contains(px, py)) barTap(i)
                              return true
                          }
                          selected = nearest(px, py)
                          selected?.let { dragDx = it.x * width - px; dragDy = it.y * height - py }
                      }
                      MotionEvent.ACTION_MOVE -> selected?.let {
                          if (py <= height * 0.74f) {
                              it.x = ((px + dragDx) / width).coerceIn(0.03f, 0.97f)
                              it.y = ((py + dragDy) / height).coerceIn(0.05f, 0.72f)
                          }
                      }
                      MotionEvent.ACTION_UP -> persist()
                  }
                  invalidate()
                  return true
              }

              private fun barTap(i: Int) {
                  val e = selected
                  when (i) {
                      0 -> e?.let { it.s = (it.s * 0.9f).coerceAtLeast(0.08f) }
                      1 -> e?.let { it.s = (it.s * 1.1f).coerceAtMost(0.6f) }
                      2 -> e?.let { it.visible = !it.visible }
                      3 -> resetLayout()
                      4 -> { persist(); editMode = false }
                  }
                  persist()
                  invalidate()
              }

              fun releaseAll() {
                  heldKeys.forEach { send("K $it 0") }
                  heldKeys.clear(); pressed.clear()
                  if (dpadX != 0f || dpadY != 0f) { dpadX = 0f; dpadY = 0f; send("D 0 0") }
              }
          }
          EOF_PADVIEW
          cat > overlay/PadActivity.kt <<'EOF_PADACTIVITY'
          package com.swordfish.lemuroid.app.shared.remotepad

          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Context
          import android.content.pm.ActivityInfo
          import android.graphics.Color
          import android.os.Bundle
          import android.text.InputType
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.TextView
          import java.net.Inet4Address

          /** Phone side: enter the code shown on the TV, then use the phone as a gamepad. */
          class PadActivity : Activity() {
              private val prefs by lazy { getSharedPreferences("sakora_pad", Context.MODE_PRIVATE) }
              private var client: PadClient? = null
              private var pad: PadView? = null
              private var status: TextView? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_PORTRAIT
                  showConnectScreen()
              }

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              private fun showConnectScreen(message: String = "") {
                  pad = null
                  requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_PORTRAIT
                  window.clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  window.decorView.systemUiVisibility = View.SYSTEM_UI_FLAG_VISIBLE

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setBackgroundColor(Color.rgb(18, 18, 24))
                      setPadding(dp(28), dp(28), dp(28), dp(28))
                  }
                  root.addView(TextView(this).apply {
                      text = "Phone Pad"; textSize = 32f; setTextColor(Color.WHITE); gravity = Gravity.CENTER
                  })
                  root.addView(TextView(this).apply {
                      text = "Open this app on your TV, start a game, and type the code shown in the top corner.\nPhone and TV must be on the same Wi-Fi."
                      textSize = 15f; setTextColor(Color.LTGRAY); gravity = Gravity.CENTER
                      setPadding(0, dp(12), 0, dp(24))
                  })
                  val input = EditText(this).apply {
                      hint = "Code (e.g. 48392)"
                      setText(prefs.getString("code", ""))
                      inputType = InputType.TYPE_CLASS_TEXT
                      textSize = 30f; gravity = Gravity.CENTER
                      setTextColor(Color.WHITE); setHintTextColor(Color.GRAY)
                  }
                  root.addView(input)
                  val btn = Button(this).apply { text = "Connect"; textSize = 20f }
                  root.addView(btn)
                  status = TextView(this).apply {
                      text = message; textSize = 15f; setTextColor(Color.rgb(255, 190, 120)); gravity = Gravity.CENTER
                      setPadding(0, dp(16), 0, 0)
                  }
                  root.addView(status)
                  setContentView(root)

                  btn.setOnClickListener {
                      val raw = input.text.toString().trim()
                      if (raw.isEmpty()) { status?.text = "Type the code from the TV"; return@setOnClickListener }
                      prefs.edit().putString("code", raw).apply()
                      status?.setTextColor(Color.LTGRAY)
                      status?.text = "Connecting..."
                      btn.isEnabled = false
                      connect(raw) { err ->
                          runOnUiThread {
                              btn.isEnabled = true
                              status?.setTextColor(Color.rgb(255, 190, 120))
                              status?.text = err
                          }
                      }
                  }
              }

              /** raw = 5-digit code, or a full IP address like 192.168.1.20 (code is then asked from the TV's last digits). */
              private fun connect(raw: String, fail: (String) -> Unit) {
                  Thread {
                      try {
                          val host: String
                          val code: String
                          if (raw.contains(".")) {
                              host = raw
                              // Full IP typed: derive the code the TV shows from the same two last bytes.
                              val p = raw.split(".")
                              code = (p[2].toInt() * 256 + p[3].toInt()).toString().padStart(5, '0')
                          } else {
                              val mine = RemotePadHost.localIpv4() as Inet4Address?
                                  ?: throw IllegalStateException("Phone is not on Wi-Fi")
                              val v = raw.toInt()
                              if (v !in 0..65535) throw IllegalStateException("Code should be 5 digits")
                              val b = mine.address
                              host = "${b[0].toInt() and 0xff}.${b[1].toInt() and 0xff}.${v / 256}.${v % 256}"
                              code = raw.padStart(5, '0')
                          }
                          val c = PadClient { runOnUiThread { onLost() } }
                          val player = c.connect(host, code)
                          client = c
                          runOnUiThread { showPad(player) }
                      } catch (e: Exception) {
                          fail(
                              when {
                                  e.message == "Wrong code" -> "Wrong code, or TV has no game running"
                                  e is java.net.SocketTimeoutException || e is java.net.ConnectException ->
                                      "Can't reach the TV. Is a game open on it, and are both on the same Wi-Fi?"
                                  else -> e.message ?: "Connection failed"
                              },
                          )
                      }
                  }.start()
              }

              private fun showPad(player: Int) {
                  requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  window.decorView.systemUiVisibility = (
                      View.SYSTEM_UI_FLAG_FULLSCREEN or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY or View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      )
                  val c = client ?: return
                  val v = PadView(
                      this,
                      send = { c.send(it) },
                      onMenu = { showMenu() },
                      loadLayout = { prefs.getString("layout_v1", null) },
                      saveLayout = { prefs.edit().putString("layout_v1", it).apply() },
                  )
                  pad = v
                  setContentView(v)
                  v.toast("Connected as player ${player + 1}")
              }

              private fun showMenu() {
                  val p = pad ?: return
                  AlertDialog.Builder(this)
                      .setItems(arrayOf("Edit button layout", "Reset layout", "Disconnect")) { _, which ->
                          when (which) {
                              0 -> p.editMode = true
                              1 -> p.resetLayout()
                              2 -> { disconnect(); showConnectScreen() }
                          }
                      }
                      .show()
              }

              private fun disconnect() {
                  pad?.releaseAll()
                  client?.close()
                  client = null
              }

              private fun onLost() {
                  if (client != null) {
                      client = null
                      showConnectScreen("Connection lost. Reconnect when the game is running.")
                  }
              }

              override fun onDestroy() {
                  disconnect()
                  super.onDestroy()
              }
          }
          EOF_PADACTIVITY
          cat > patch.py <<'EOF_PATCH'
          import os, shutil, sys

          R = sys.argv[1] if len(sys.argv) > 1 else "Lemuroid"
          APP = f"{R}/lemuroid-app/src/main"
          JAVA = f"{APP}/java/com/swordfish/lemuroid/app"

          def edit(path, old, new):
              s = open(path, encoding="utf-8").read()
              assert old in s, f"anchor not found in {path}: {old[:60]!r}"
              open(path, "w", encoding="utf-8").write(s.replace(old, new, 1))

          # 1) new files
          os.makedirs(f"{JAVA}/shared/remotepad", exist_ok=True)
          for f in ("RemotePadHost.kt", "PadClient.kt", "PadView.kt", "PadActivity.kt"):
              shutil.copy(f"overlay/{f}", f"{JAVA}/shared/remotepad/{f}")

          # 2) view model: inject remote input
          edit(f"{JAVA}/shared/game/BaseGameScreenViewModel.kt",
          """    fun sendMotionEvent(event: MotionEvent): Boolean {
                  return inputs.sendMotionEvent(event)
              }
          """,
          """    fun sendMotionEvent(event: MotionEvent): Boolean {
                  return inputs.sendMotionEvent(event)
              }

              fun injectRemoteKey(keyCode: Int, pressed: Boolean, port: Int) {
                  val action = if (pressed) KeyEvent.ACTION_DOWN else KeyEvent.ACTION_UP
                  retroGameView.retroGameView?.sendKeyEvent(action, keyCode, port)
              }

              fun injectRemoteDpad(x: Float, y: Float, port: Int) {
                  retroGameView.retroGameView?.sendMotionEvent(GLRetroView.MOTION_SOURCE_DPAD, x, y, port)
              }
          """)

          # 3) game activity: start the host, handle lines
          A = f"{JAVA}/shared/game/BaseGameActivity.kt"
          edit(A, "        initialiseFlows()\n    }\n\n    @Composable\n    abstract fun GameScreen",
                  "        initialiseFlows()\n        startRemotePad()\n    }\n\n    @Composable\n    abstract fun GameScreen")
          edit(A, "    private fun performSuccessfulActivityFinish() {", '''    private var remotePad: com.swordfish.lemuroid.app.shared.remotepad.RemotePadHost? = null
              private var padBanner: android.widget.TextView? = null
              private val padHeld = HashMap<Int, MutableSet<Int>>()

              private fun startRemotePad() {
                  val tv =
                      android.widget.TextView(this).apply {
                          setTextColor(android.graphics.Color.WHITE)
                          setBackgroundColor(android.graphics.Color.argb(150, 0, 0, 0))
                          textSize = 16f
                          setPadding(24, 12, 24, 12)
                      }
                  addContentView(
                      tv,
                      android.widget.FrameLayout.LayoutParams(
                          android.view.ViewGroup.LayoutParams.WRAP_CONTENT,
                          android.view.ViewGroup.LayoutParams.WRAP_CONTENT,
                          android.view.Gravity.TOP or android.view.Gravity.END,
                      ).apply { setMargins(24, 24, 24, 24) },
                  )
                  padBanner = tv
                  val host =
                      com.swordfish.lemuroid.app.shared.remotepad.RemotePadHost(
                          onInput = { player, line -> runOnUiThread { handleRemoteLine(player, line) } },
                          onClients = { n -> runOnUiThread { updatePadBanner(n) } },
                      )
                  remotePad = host
                  host.start()
                  updatePadBanner(0)
              }

              private fun updatePadBanner(clients: Int) {
                  val tv = padBanner ?: return
                  val code = remotePad?.code ?: "-----"
                  if (clients > 0) {
                      tv.visibility = android.view.View.GONE
                  } else {
                      tv.text = if (code == "00000") "Phone pad: connect TV to Wi-Fi" else "Phone pad code: $code"
                      tv.visibility = android.view.View.VISIBLE
                  }
              }

              private fun handleRemoteLine(
                  player: Int,
                  line: String,
              ) {
                  try {
                      val vm = baseGameScreenViewModel
                      val p = line.split(" ")
                      when (p[0]) {
                          "K" -> {
                              val key = p[1].toInt()
                              val down = p[2] == "1"
                              vm.injectRemoteKey(key, down, player)
                              val held = padHeld.getOrPut(player) { HashSet() }
                              if (down) held.add(key) else held.remove(key)
                          }
                          "D" -> vm.injectRemoteDpad(p[1].toFloat(), p[2].toFloat(), player)
                          "X" -> {
                              padHeld.remove(player)?.forEach { vm.injectRemoteKey(it, false, player) }
                              vm.injectRemoteDpad(0f, 0f, player)
                          }
                          "C" ->
                              when (p[1]) {
                                  "SAVE" -> {
                                      val slot = p[2].toInt()
                                      lifecycleScope.launch {
                                          vm.saveSlot(slot)
                                          displayToast("Saved to slot ${slot + 1}")
                                      }
                                  }
                                  "LOAD" -> {
                                      val slot = p[2].toInt()
                                      lifecycleScope.launch {
                                          vm.loadSlot(slot)
                                          displayToast("Loaded slot ${slot + 1}")
                                      }
                                  }
                                  "FF" -> vm.toggleFastForward()
                                  "RESET" -> lifecycleScope.launch { vm.reset() }
                              }
                      }
                  } catch (e: Exception) {
                      Timber.e(e, "Bad remote pad line: $line")
                  }
              }

              private fun performSuccessfulActivityFinish() {''')
          edit(A, "    override fun onDestroy() {\n        if (!isChangingConfigurations) {",
