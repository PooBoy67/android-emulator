                  "    }\n\n"
                  "    private fun drawDpad(c: Canvas, e: Elt, d: Float) {")
          edit(V, "            val e = nearest(px, py)\n            if (e != null && e.kind == Kind.CMD) {",
                  "            val e = nearest(px, py)\n            if (stickMode && e != null && e.kind == Kind.DPAD) stickPointer = ev.getPointerId(i)\n            if (e != null && e.kind == Kind.CMD) {")
